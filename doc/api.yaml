openapi: 3.0.3
servers:
  - url: http://localhost:3000
info:
  title: WASAtext API
  description: API per il progetto WASAtext (login semplificato, chat dirette e di gruppo).
  version: 1.0.0

paths:
  /liveness:
    get:
      tags: [System]
      operationId: getLiveness
      summary: Liveness probe
      responses:
        "200":
          description: Servizio attivo
        "500":
          description: Servizio non disponibile

  /api/login:
    post:
      tags: [Session]
      operationId: doLogin
      summary: Login utente (crea o recupera sessione)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login eseguito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Username non valido
        "500":
          description: Errore interno

  /api/logout:
    post:
      tags: [Session]
      operationId: doLogout
      summary: Logout utente
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Logout eseguito
        "401":
          description: Non autorizzato

  /api/me:
    get:
      tags: [Profile]
      operationId: getMyProfile
      summary: Dati profilo utente autenticato
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Profilo utente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Non autorizzato
    put:
      tags: [Profile]
      operationId: setMyUserName
      summary: Aggiorna nome profilo
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profilo aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Dati non validi
        "401":
          description: Non autorizzato
        "409":
          description: Username/DisplayName già in uso

  /api/me/photo:
    put:
      tags: [Profile]
      operationId: setMyPhoto
      summary: Aggiorna la foto profilo
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePhotoRequest"
      responses:
        "200":
          description: Profilo aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Dati non validi
        "401":
          description: Non autorizzato

  /api/users:
    get:
      tags: [Users]
      operationId: getUsers
      summary: Lista utenti
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Lista utenti
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          description: Non autorizzato

  /api/conversations:
    get:
      tags: [Conversations]
      operationId: getMyConversations
      summary: Lista conversazioni dell'utente
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Lista conversazioni
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
        "401":
          description: Non autorizzato

  /api/conversations/direct:
    post:
      tags: [Conversations]
      operationId: createDirectConversation
      summary: Crea o recupera chat diretta
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDirectRequest"
      responses:
        "200":
          description: Conversazione creata o recuperata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: Dati non validi
        "401":
          description: Non autorizzato
        "404":
          description: Utente non trovato

  /api/conversations/group:
    post:
      tags: [Conversations]
      operationId: createGroupConversation
      summary: Crea un gruppo
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "200":
          description: Gruppo creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: Dati non validi
        "401":
          description: Non autorizzato

  /api/conversation/{id}:
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: Dettaglio conversazione e messaggi
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversazione e messaggi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "401":
          description: Non autorizzato
        "403":
          description: Non membro
        "404":
          description: Conversazione non trovata
    put:
      tags: [Conversations]
      operationId: setGroupName
      summary: Aggiorna nome/immagine gruppo
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConversationRequest"
      responses:
        "200":
          description: Conversazione aggiornata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          description: Non autorizzato
        "403":
          description: Non membro

  /api/conversation/{id}/photo:
    put:
      tags: [Conversations]
      operationId: setGroupPhoto
      summary: Aggiorna immagine del gruppo
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePhotoRequest"
      responses:
        "200":
          description: Conversazione aggiornata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          description: Non autorizzato
        "403":
          description: Non membro

  /api/conversation/{id}/add:
    post:
      tags: [Conversations]
      operationId: addToGroup
      summary: Aggiungi membro al gruppo
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
      responses:
        "204":
          description: Membro aggiunto
        "400":
          description: Dati non validi
        "401":
          description: Non autorizzato
        "403":
          description: Non membro
        "404":
          description: Utente non trovato

  /api/conversation/{id}/leave:
    post:
      tags: [Conversations]
      operationId: leaveGroup
      summary: Esci dal gruppo
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "204":
          description: Uscita completata
        "401":
          description: Non autorizzato
        "403":
          description: Non membro

  /api/conversation/{id}/messages:
    post:
      tags: [Messages]
      operationId: sendMessage
      summary: Invia un messaggio
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: Messaggio creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResponse"
        "400":
          description: Dati non validi
        "401":
          description: Non autorizzato
        "403":
          description: Non membro

  /api/messages/{id}/read:
    post:
      tags: [Messages]
      operationId: setMessageRead
      summary: Segna messaggio come letto
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "204":
          description: Letto
        "401":
          description: Non autorizzato
        "403":
          description: Non membro
        "404":
          description: Messaggio non trovato

  /api/messages/{id}/reaction:
    post:
      tags: [Reactions]
      operationId: commentMessage
      summary: Aggiungi o aggiorna reazione
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionRequest"
      responses:
        "204":
          description: Reazione salvata
        "400":
          description: Dati non validi
        "401":
          description: Non autorizzato
        "403":
          description: Non membro
    delete:
      tags: [Reactions]
      operationId: uncommentMessage
      summary: Rimuovi reazione
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "204":
          description: Reazione rimossa
        "401":
          description: Non autorizzato

  /api/messages/{id}/forward:
    post:
      tags: [Messages]
      operationId: forwardMessage
      summary: Inoltra un messaggio
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForwardMessageRequest"
      responses:
        "201":
          description: Messaggio inoltrato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResponse"
        "400":
          description: Dati non validi
        "401":
          description: Non autorizzato
        "403":
          description: Non membro
        "404":
          description: Messaggio non trovato

  /api/messages/{id}:
    delete:
      tags: [Messages]
      operationId: deleteMessage
      summary: Elimina un messaggio inviato
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "204":
          description: Messaggio eliminato
        "401":
          description: Non autorizzato
        "403":
          description: Non autorizzato a eliminare
        "404":
          description: Messaggio non trovato

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UUID

  parameters:
    ConversationId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    MessageId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        photo:
          type: string
      required: [id, username, displayName, photo]

    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
      required: [username]

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required: [token, user]

    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          type: string
      required: [displayName]

    UpdatePhotoRequest:
      type: object
      properties:
        photo:
          type: string
      required: [photo]

    Conversation:
      type: object
      properties:
        id:
          type: integer
          format: int64
        isGroup:
          type: boolean
        name:
          type: string
        photo:
          type: string
        members:
          type: array
          items:
            $ref: "#/components/schemas/User"
      required: [id, isGroup, name, photo, members]

    ConversationDetail:
      type: object
      properties:
        conversation:
          $ref: "#/components/schemas/Conversation"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
      required: [conversation, messages]

    CreateDirectRequest:
      type: object
      properties:
        username:
          type: string
      required: [username]

    CreateGroupRequest:
      type: object
      properties:
        name:
          type: string
        members:
          type: array
          items:
            type: string
      required: [name, members]

    UpdateConversationRequest:
      type: object
      properties:
        name:
          type: string
        photo:
          type: string
      required: [name]

    AddMemberRequest:
      type: object
      properties:
        username:
          type: string
      required: [username]

    SendMessageRequest:
      type: object
      properties:
        text:
          type: string
        image:
          type: string
        replyToId:
          type: integer
          format: int64
      required: []

    SendMessageResponse:
      type: object
      properties:
        messageId:
          type: integer
          format: int64
      required: [messageId]

    ForwardMessageRequest:
      type: object
      properties:
        toConversationId:
          type: integer
          format: int64
      required: [toConversationId]

    Message:
      type: object
      properties:
        id:
          type: integer
          format: int64
        conversationId:
          type: integer
          format: int64
        text:
          type: string
        image:
          type: string
        replyToId:
          type: integer
          format: int64
          nullable: true
        forwarded:
          type: boolean
        createdAt:
          type: string
          format: date-time
        sender:
          $ref: "#/components/schemas/User"
        readBy:
          type: array
          items:
            type: integer
            format: int64
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/Reaction"
      required: [id, conversationId, text, image, forwarded, createdAt, sender, readBy, reactions]

    ReactionRequest:
      type: object
      properties:
        emoji:
          type: string
      required: [emoji]

    Reaction:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
        emoji:
          type: string
      required: [userId, username, emoji]
